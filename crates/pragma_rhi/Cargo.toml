[package]
name = "pragma_rhi"
description = "Render Hardware Interface for pragma.core-based game engines and frameworks, in pure Rust"
readme = "README.md"
documentation = "https://docs.rs/pragma_rhi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
# Published from 1.0.0 (DECISIONS.md #30); its own README and LICENSE go into the package.

[lib]
# Only the criterion targets below are benchmarks, so `cargo bench -- <criterion flags>` works.
bench = false

[dependencies]
pragma_core = { workspace = true, features = ["jobs", "graph", "async"] }
thiserror = { workspace = true }
wgpu = { workspace = true }
naga = { workspace = true }
pollster = { workspace = true }
raw-window-handle = { workspace = true }
bitflags = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "resources"
harness = false

[[bench]]
name = "recording"
harness = false

[[bench]]
name = "submission"
harness = false

[lints]
workspace = true
