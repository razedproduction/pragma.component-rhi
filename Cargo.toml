[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["razed <razed.production@yandex.ru>"]
repository = "https://github.com/razedproduction/pragma.component-rhi"
keywords = ["gamedev", "rhi", "gpu", "rendering", "pragma"]
categories = ["game-development", "graphics", "rendering::graphics-api"]

[workspace.dependencies]
# Internal crates: exact versions (lockstep), as in pragma.core (DECISIONS.md #4).
pragma_rhi = { path = "crates/pragma_rhi", version = "=0.3.0" }

# The runtime core this component is built on (DECISIONS.md #2).
pragma_core = { version = "1.0.0", default-features = false }

# External - pure Rust only (deny.toml).
# The GPU backend (DECISIONS.md #8): only the Vulkan and D3D12 backends of the supported platforms
# (DECISIONS.md #3); no GLES (EGL/ANGLE), Metal or WebGPU.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "naga-ir"] }
# Shaders are parsed and validated by `pragma_rhi` itself, on every backend, and handed to wgpu as
# naga IR (DECISIONS.md #13); the version is the one wgpu 30 is built on.
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "spv-in"] }
# Blocks on wgpu's adapter/device futures without an async runtime (DECISIONS.md #11).
pollster = "0.4.0"
bitflags = "2.13.2"
thiserror = "2.0.21"

# Dev / verification.
proptest = "1.12.0"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "warn"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
arithmetic_side_effects = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
